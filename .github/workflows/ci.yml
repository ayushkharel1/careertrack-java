name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: careertrack-jar
          path: target/careertrack-1.0.0.jar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          java -jar target/careertrack-1.0.0.jar > /tmp/careertrack.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/applications > /dev/null; then break; fi
            sleep 1
          done
          node scripts/ui-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-preview
          path: |
            docs/dashboard.png
            docs/mobile.png
            /tmp/careertrack.log
